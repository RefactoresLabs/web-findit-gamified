name: Frontend CI (Validation)

on:
  push:
    branches: [ "test/pr", "main" ]
  pull_request:
    branches: [ "test/pr" ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit 

      - name: Lint (ESLint)
        run: npm run lint --if-present 

      - name: Build Production (Tailwind Check)
        run: npm run build

  